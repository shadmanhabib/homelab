---
# Homepage configuration
# See https://fontawesome.com/v5/search for icons options

title: "App dashboard"
subtitle: "Home"
icon: "fas fa-server"

header: true
footer: false

columns: "auto" # "auto" or number (must be a factor of 12: 1, 2, 3, 4, 6, 12)

# Optional theme customization
theme: default
colors:
  light:
    highlight-primary: "#3367d6"
    highlight-secondary: "#4285f4"
    highlight-hover: "#5a95f5"
    background: "#f5f5f5"
    card-background: "#ffffff"
    text: "#363636"
    text-header: "#ffffff"
    text-title: "#303030"
    text-subtitle: "#424242"
    card-shadow: rgba(0, 0, 0, 0.1)
    link: "#3273dc"
    link-hover: "#363636"
  dark:
    highlight-primary: "#3367d6"
    highlight-secondary: "#4285f4"
    highlight-hover: "#5a95f5"
    background: "#131313"
    card-background: "#2b2b2b"
    text: "#eaeaea"
    text-header: "#ffffff"
    text-title: "#fafafa"
    text-subtitle: "#f5f5f5"
    card-shadow: rgba(0, 0, 0, 0.4)
    link: "#3273dc"
    link-hover: "#ffdd57"

# Optional message
# message:
#   #url: https://b4bz.io
#   style: "is-dark" # See https://bulma.io/documentation/components/message/#colors for styling options.
#   title: "Welcome!"
#   icon: "fa fa-house"
#   content: "This is the homepage for the network. From here you can access and manage most of the locally run services."

# Optional navbar
# links: [] # Allows for navbar (dark mode, layout, and search) without any links
links:
  - name: "GitHub"
    icon: "fab fa-github"
    url: "https://github.com/shadmanhabib"
    target: "_blank" # optional html a tag target attribute
  - name: "Documentation"
    icon: "fas fa-book"
    url: "https://docs.shadmanhabib.com"
  - name: "Recipes"
    icon: "fas fa-utensils"
    url: "https://recipes.shadmanhabib.com"
  # this will link to a second homer page that will load config from additional-page.yml and keep default config values as in config.yml file
  # see url field and assets/additional-page.yml.dist used in this example:
  #- name: "another page!"
  #  icon: "fas fa-file-alt"
  #  url: "#additional-page" 

# Services
# First level array represent a group.
# Leave only a "items" key if not using group (group name, icon & tagstyle are optional, section separation will not be displayed).
services:
  - name: "Applications"
    icon: "fas fa-rocket"
    items:
      - name: "Actual Budget"
        logo: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/actual-budget.png"
        subtitle: "Personal budget"
        tag: "app"
        url: "https://budget.shabib.app/"
      - name: "Crafty Controller"
        logo: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/crafty-controller.svg"
        subtitle: "Minecraft server"
        tag: "app"
        url: "https://crafty.shabib.app/"
      - name: "File Browser"
        logo: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/filebrowser.png"
        subtitle: "File server"
        tag: "app"
        url: "https://files.shabib.app/"
      - name: "Home Assistant"
        logo: "https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/home-assistant.png"
        subtitle: "Home automation"
        tag: "app"
        url: "https://home.shabib.app/"
      - name: "Jellyfin"
        logo: "https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/jellyfin.png"
        subtitle: "Personal media collection"
        tag: "app"
        url: "https://jellyfin.shabib.app/"
      - name: "Mealie"
